<!-- One hero tile (BRG-84 §3.3). params: kind, ground (bg-raised|mode-cabina|mode-bridge), name, tag (a|div), href, mark (text), copy (set on loop copies) -->
<{{tag|div}} class="r3-tile {{ground}}" data-tile="{{kind}}" {{href?|href="@"}} {{copy?|aria-hidden="true" inert data-tile-copy}}>
  <span class="r3-tile-mark" aria-hidden="true">{{mark|}}</span>
  <span class="r3-tile-name">{{name}}</span>
</{{tag|div}}>
