<!-- params: id, name, label, type(text|email|tel), hint, error, required, disabled, value, placeholder, autocomplete, state(is-hover|is-focus) -->
<div class="field">
  <label class="field-label" for="{{id}}">{{label}}{{required?|<span class="font-normal text-muted"> (obligatorio)</span>}}</label>
  <input class="control {{state|}}" type="{{type|text}}" id="{{id}}" name="{{name}}" value="{{value|}}" placeholder="{{placeholder|}}" autocomplete="{{autocomplete|off}}" {{type==tel|inputmode="tel"}} {{required?|required}} {{disabled?|disabled}} {{error?|aria-invalid="true"}} aria-describedby="{{id}}-hint {{id}}-err">
  <p id="{{id}}-hint" class="field-msg hint">{{hint|}}</p>
  <p id="{{id}}-err" class="field-msg err">{{error?|<svg class="icon icon-20" aria-hidden="true"><use href="#i-circle-alert"/></svg><span>@</span>}}</p>
</div>
