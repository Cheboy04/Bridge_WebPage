<!-- params: id, name, label, options (<option> html, single quotes inside), hint, error, required, disabled, state -->
<div class="field">
  <label class="field-label" for="{{id}}">{{label}}{{required?|<span class="font-normal text-muted"> (obligatorio)</span>}}</label>
  <div class="relative">
    <select class="control {{state|}}" id="{{id}}" name="{{name}}" {{required?|required}} {{disabled?|disabled}} {{error?|aria-invalid="true"}} aria-describedby="{{id}}-hint {{id}}-err">{{options}}</select>
    <svg class="icon icon-20 pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-muted" aria-hidden="true"><use href="#i-chevron-down"/></svg>
  </div>
  <p id="{{id}}-hint" class="field-msg hint">{{hint|}}</p>
  <p id="{{id}}-err" class="field-msg err">{{error?|<svg class="icon icon-20" aria-hidden="true"><use href="#i-circle-alert"/></svg><span>@</span>}}</p>
</div>
