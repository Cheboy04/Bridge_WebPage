<!-- PROVISIONAL digital certification seal, based on stamp sketch S1 (dotted ring). Documento only. Not for production use. params: uid(unique per page), size(px, 240) -->
<svg role="img" aria-label="Sello de certificación (diseño provisional)" viewBox="0 0 240 240" width="{{size|240}}" height="{{size|240}}" class="max-w-full h-auto" data-provisional="true">
  <defs>
    <path id="{{uid|s}}-top" d="M 44 120 A 76 76 0 0 1 196 120"/>
    <path id="{{uid|s}}-bot" d="M 34 120 A 86 86 0 0 0 206 120"/>
  </defs>
  <circle cx="120" cy="120" r="108" fill="none" style="stroke:var(--trail)" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 24.235" transform="rotate(-90 120 120)"/>
  <circle cx="120" cy="120" r="94" style="fill:var(--surface-raised)"/>
  <g style="fill:var(--text)" font-family="Manrope, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="2.4" text-anchor="middle">
    <text><textPath href="#{{uid|s}}-top" startOffset="50%">TRADUCCIÓN</textPath></text>
    <text><textPath href="#{{uid|s}}-bot" startOffset="50%">CERTIFICADA</textPath></text>
  </g>
  <image href="assets/logo/bridge-symbol.svg" x="66" y="66" width="108" height="108"/>
</svg>
